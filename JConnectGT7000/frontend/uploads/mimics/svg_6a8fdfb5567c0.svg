<svg xmlns="http://w3.org" viewBox="0 0 900 550" width="100%" height="100%">
  <!-- Background Style SCADA Control Room -->
  <rect width="900" height="550" fill="#1C1F24" />
  
  <!-- Grid Background Layer -->
  <g stroke="#282C34" stroke-width="1">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,350 L 900,350 M 0,400 L 900,400 M 0,450 L 900,450 M 0,500 L 900,500" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550" />
  </g>

  <!-- TOP HEADER BAR -->
  <rect width="900" height="40" fill="#21252B" stroke="#3F444E" stroke-width="1" />
  <text x="20" y="26" fill="#ABB2BF" font-family="Consolas, Monaco, monospace" font-size="16" font-weight="bold">HMI SYSTEM: POWER DISTRIBUTION PANEL</text>
  <text x="750" y="26" fill="#61AFEF" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="bold">STATUS: OK</text>

  <!-- ================= BUSBAR / LINES (SCADA STYLE) ================= -->
  <!-- Main Power Busbar (Active - Green #22C55E) -->
  <path d="M 260,160 L 400,160 L 400,240" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="square" />
  
  <!-- Generator Busbar (De-energized/Standby - Red #EF4444) -->
  <path d="M 260,390 L 400,390 L 400,310" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="square" />
  
  <!-- Output Busbar (Active Feed - Green #22C55E) -->
  <path d="M 520,275 L 680,275" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="square" />

  <!-- ================= BLOCK 1: MAIN POWER (SOURCE 1) ================= -->
  <g transform="translate(40, 110)">
    <!-- Outline Block -->
    <rect width="220" height="110" fill="#282C34" stroke="#3E4451" stroke-width="2" />
    <!-- Header Block -->
    <rect width="220" height="25" fill="#3E4451" />
    <text x="10" y="18" fill="#E06C75" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SOURCE 01: MAIN GRID</text>
    
    <!-- SCADA Status Indicator -->
    <circle cx="25" cy="50" r="8" fill="#22C55E" />
    <text x="42" y="55" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">LINE AVAILABLE</text>
    
    <!-- Digital Readouts -->
    <rect x="15" y="70" width="90" height="25" fill="#1E2227" stroke="#3E4451" />
    <text x="20" y="87" fill="#61AFEF" font-family="Consolas, monospace" font-size="13">380.5 VAC</text>
    
    <rect x="115" y="70" width="90" height="25" fill="#1E2227" stroke="#3E4451" />
    <text x="120" y="87" fill="#61AFEF" font-family="Consolas, monospace" font-size="13">50.02 Hz</text>
  </g>

  <!-- ================= BLOCK 2: GENERATOR (SOURCE 2) ================= -->
  <g transform="translate(40, 330)">
    <rect width="220" height="110" fill="#282C34" stroke="#3E4451" stroke-width="2" />
    <rect width="220" height="25" fill="#3E4451" />
    <text x="10" y="18" fill="#E5C07B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SOURCE 02: GENERATOR</text>
    
    <circle cx="25" cy="50" r="8" fill="#E5C07B" />
    <text x="42" y="55" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">STANDBY MODE</text>
    
    <rect x="15" y="70" width="90" height="25" fill="#1E2227" stroke="#3E4451" />
    <text x="20" y="87" fill="#5C6370" font-family="Consolas, monospace" font-size="13">0.0 VAC</text>
    
    <rect x="115" y="70" width="90" height="25" fill="#1E2227" stroke="#3E4451" />
    <text x="120" y="87" fill="#5C6370" font-family="Consolas, monospace" font-size="13">0.00 Hz</text>
  </g>

  <!-- ================= CIRCUIT BREAKERS (INTERLOCK) ================= -->
  <!-- CB 1 (Main Power Side - CLOSED/GREEN) -->
  <g transform="translate(385, 145)">
    <rect width="30" height="30" fill="#1E2227" stroke="#22C55E" stroke-width="2" />
    <line x1="15" y1="0" x2="15" y2="30" stroke="#22C55E" stroke-width="3" />
    <text x="38" y="20" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="11" font-weight="bold">CB1</text>
  </g>

  <!-- CB 2 (Generator Side - OPEN/RED) -->
  <g transform="translate(385, 375)">
    <rect width="30" height="30" fill="#1E2227" stroke="#EF4444" stroke-width="2" />
    <!-- Slanted line representing open switch -->
    <line x1="15" y1="30" x2="30" y2="5" stroke="#EF4444" stroke-width="3" />
    <text x="38" y="20" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="11" font-weight="bold">CB2</text>
  </g>

  <!-- ================= BLOCK 3: ATS CONTROL UNIT ================= -->
  <g transform="translate(350, 225)">
    <!-- ATS Box -->
    <rect width="170" height="100" fill="#21252B" stroke="#61AFEF" stroke-width="2" />
    <rect width="170" height="25" fill="#61AFEF" />
    <text x="85" y="18" text-anchor="middle" fill="#1C1F24" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ATS CONTROLLER</text>
    
    <!-- Mode Select Status -->
    <text x="15" y="50" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="12">MODE: <tspan fill="#98C379" font-weight="bold">AUTO</tspan></text>
    
    <!-- Active Source Indicator Text -->
    <rect x="15" y="65" width="140" height="22" fill="#1E2227" stroke="#3E4451" />
    <text x="85" y="81" text-anchor="middle" fill="#22C55E" font-family="Arial, sans-serif" font-size="11" font-weight="bold">FEEDING FROM SRC 1</text>
  </g>

  <!-- ================= BLOCK 4: OUTPUT / LOAD SYSTEM ================= -->
  <g transform="translate(680, 220)">
    <rect width="180" height="110" fill="#282C34" stroke="#22C55E" stroke-width="2" />
    <rect width="180" height="25" fill="#22C55E" />
    <text x="10" y="18" fill="#1C1F24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SYSTEM OUTPUT (LOAD)</text>
    
    <!-- Load Metrics -->
    <text x="15" y="50" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="12">CURRENT: <tspan fill="#61AFEF" font-family="Consolas, monospace">145.2 A</tspan></text>
    <text x="15" y="72" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="12">POWER: <tspan fill="#61AFEF" font-family="Consolas, monospace">95.6 kW</tspan></text>
    <text x="15" y="94" fill="#ABB2BF" font-family="Arial, sans-serif" font-size="12">PF: <tspan fill="#61AFEF" font-family="Consolas, monospace">0.92</tspan></text>
  </g>
  
  <!-- Flow Direction Arrows -->
  <polygon points="320,156 320,164 330,160" fill="#22C55E" />
  <polygon points="610,271 610,279 620,275" fill="#22C55E" />

</svg>
