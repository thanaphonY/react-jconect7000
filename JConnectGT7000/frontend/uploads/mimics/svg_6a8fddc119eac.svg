<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="font-family: Arial, sans-serif;">
  <defs>
    <!-- Background Grill Pattern -->
    <pattern id="grillPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c2c7cc" />
      <polygon points="6,0 12,3 12,9 6,12 0,9 0,3" fill="#1b1d1f" />
      <polygon points="6,1.5 10.5,3.75 10.5,8.25 6,10.5 1.5,8.25 1.5,3.75" fill="#2d3033" />
    </pattern>

    <!-- Outer Metallic Panel Gradient -->
    <linearGradient id="metalPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#abafb3" />
      <stop offset="3%" stop-color="#8e9398" />
      <stop offset="50%" stop-color="#7a7f84" />
      <stop offset="97%" stop-color="#696d72" />
      <stop offset="100%" stop-color="#4d5054" />
    </linearGradient>

    <!-- Inner Metallic Bezel Gradient -->
    <linearGradient id="innerBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6dadf" />
      <stop offset="30%" stop-color="#b0b5ba" />
      <stop offset="70%" stop-color="#888d93" />
      <stop offset="100%" stop-color="#5f6368" />
    </linearGradient>

    <!-- Screen Bezel Dark Area -->
    <linearGradient id="darkBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d30" />
      <stop offset="100%" stop-color="#191a1c" />
    </linearGradient>

    <!-- Status LED Glow Effects -->
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="yellowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Bezel -->
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Ventilation Grill -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#grillPattern)" />

  <!-- Main Cabinet Panel (Gray Outer Frame) -->
  <rect x="40" y="65" width="1120" height="540" rx="20" fill="url(#metalPanel)" filter="url(#panelShadow)" stroke="#434649" stroke-width="2" />

  <!-- GalaxyVM Logo (Top Left) -->
  <text x="50" y="105" font-size="28" font-weight="bold" fill="#1b242a" letter-spacing="-0.5">GalaxyVM</text>

  <!-- UPS-A Black Nameplate (Top Right) -->
  <g transform="translate(920, 80)">
    <rect x="0" y="0" width="195" height="48" rx="4" fill="#111315" stroke="#3d4043" stroke-width="1.5" />
    <!-- Screws on Nameplate -->
    <circle cx="10" cy="24" r="3.5" fill="#787d82" stroke="#222" stroke-width="0.8" />
    <line x1="8" y1="24" x2="12" y2="24" stroke="#222" stroke-width="0.8" />
    <circle cx="185" cy="24" r="3.5" fill="#787d82" stroke="#222" stroke-width="0.8" />
    <line x1="183" y1="24" x2="187" y2="24" stroke="#222" stroke-width="0.8" />
    <text x="97.5" y="32" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">UPS-A</text>
  </g>

  

  <!-- Inner Display Frame / Bezel -->
  <rect x="250" y="115" width="640" height="440" rx="15" fill="url(#innerBezel)" filter="url(#panelShadow)" stroke="#3a3d40" stroke-width="2" />
  <rect x="258" y="123" width="624" height="424" rx="10" fill="#a4a9ae" stroke="#6e7378" stroke-width="1.5" />

  <!-- LCD Screen Container Area -->
  <rect x="385" y="170" width="370" height="240" rx="3" fill="#111" stroke="#3a3e42" stroke-width="3" />
  
  <!-- ================= LCD DISPLAY CONTENT ================= -->
  <rect x="388" y="173" width="364" height="234" fill="#ffffff" />

  <!-- Header Bar -->
  <g transform="translate(388, 173)">
    <!-- Home Button -->
    <rect x="4" y="4" width="22" height="22" rx="3" fill="#3eb853" />
    <path d="M 15 8 L 9 14 L 11 14 L 11 21 L 14 21 L 14 17 L 16 17 L 16 21 L 19 21 L 19 14 L 21 14 Z" fill="#ffffff" />
    
    <!-- Title -->
    <text x="182" y="19" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Galaxy VM 200 kVA</text>
    
    <!-- Checkmark Button -->
    <g transform="translate(338, 4)">
      <circle cx="11" cy="11" r="11" fill="#3eb853" />
      <path d="M 6 11 L 9.5 15 L 16 7.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <line x1="388" y1="201" x2="752" y2="201" stroke="#cbd5e1" stroke-width="1" />

  <!-- Grid Layout - Top Row -->
  <!-- 1. Output Voltage Box -->
  <g transform="translate(393, 205)">
    <rect x="0" y="0" width="112" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="56" y="11" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">Output Voltage</text>
    <line x1="12" y1="15" x2="100" y2="15" stroke="#94a3b8" stroke-width="0.6" />
    <text x="12" y="14" font-size="6.5" fill="#64748b">190</text>
    <text x="100" y="14" font-size="6.5" fill="#64748b" text-anchor="end">440</text>
    
    <!-- Bars -->
    <text x="6" y="27" font-size="7.5" font-weight="bold" fill="#334155">L1-2</text>
    <rect x="25" y="20" width="60" height="8" fill="#e2e8f0" />
    <rect x="25" y="20" width="56" height="8" fill="#84cc16" />
    <text x="55" y="26.5" font-size="7" font-weight="bold" fill="#000000" text-anchor="middle">381 V</text>

    <text x="6" y="38" font-size="7.5" font-weight="bold" fill="#334155">L2-3</text>
    <rect x="25" y="31" width="60" height="8" fill="#e2e8f0" />
    <rect x="25" y="31" width="54" height="8" fill="#84cc16" />
    <text x="55" y="37.5" font-size="7" font-weight="bold" fill="#000000" text-anchor="middle">379 V</text>

    <text x="6" y="49" font-size="7.5" font-weight="bold" fill="#334155">L3-1</text>
    <rect x="25" y="42" width="60" height="8" fill="#e2e8f0" />
    <rect x="25" y="42" width="55" height="8" fill="#84cc16" />
    <text x="55" y="48.5" font-size="7" font-weight="bold" fill="#000000" text-anchor="middle">380 V</text>
  </g>

  <!-- 2. Runtime Remaining Box -->
  <g transform="translate(510, 205)">
    <rect x="0" y="0" width="112" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="56" y="11" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">Runtime Remaining</text>

    <!-- Battery Icon Graphic -->
    <g transform="translate(42, 17)">
      <rect x="9" y="0" width="10" height="2" fill="#334155" />
      <rect x="0" y="2" width="28" height="32" rx="1" fill="#84cc16" stroke="#334155" stroke-width="1" />
      <text x="14" y="16" font-size="7.5" font-weight="bold" fill="#000000" text-anchor="middle">07:37</text>
      <text x="14" y="26" font-size="6.5" font-weight="bold" fill="#000000" text-anchor="middle">hh:mm</text>
    </g>
  </g>

  <!-- 3. Total Output Power Box -->
  <g transform="translate(627, 205)">
    <rect x="0" y="0" width="120" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="60" y="11" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">Total Output Power</text>
    <line x1="10" y1="15" x2="110" y2="15" stroke="#94a3b8" stroke-width="0.6" />
    <text x="10" y="14" font-size="6.5" fill="#64748b">0</text>
    <text x="110" y="14" font-size="6.5" fill="#64748b" text-anchor="end">240</text>

    <rect x="15" y="22" width="8" height="12" fill="#84cc16" />
    <text x="28" y="31" font-size="8" font-weight="bold" fill="#1e293b">11 kVA (6.6%)</text>
    <text x="45" y="47" font-size="8" font-weight="bold" fill="#1e293b">10 kW</text>
  </g>

  <!-- Grid Layout - Bottom Row -->
  <!-- 4. Output Current & Frequency Box -->
  <g transform="translate(393, 270)">
    <rect x="0" y="0" width="112" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="56" y="11" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">Output Current</text>
    <line x1="20" y1="15" x2="100" y2="15" stroke="#94a3b8" stroke-width="0.6" />
    <text x="20" y="14" font-size="6.5" fill="#64748b">0</text>
    <text x="100" y="14" font-size="6.5" fill="#64748b" text-anchor="end">420</text>

    <!-- Phase Current Values -->
    <text x="6" y="26" font-size="7.5" font-weight="bold" fill="#334155">L1</text>
    <rect x="20" y="20" width="4" height="7" fill="#84cc16" />
    <text x="75" y="26" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="end">19 A</text>

    <text x="6" y="37" font-size="7.5" font-weight="bold" fill="#334155">L2</text>
    <rect x="20" y="31" width="4" height="7" fill="#84cc16" />
    <text x="75" y="37" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="end">19 A</text>

    <text x="6" y="48" font-size="7.5" font-weight="bold" fill="#334155">L3</text>
    <rect x="20" y="42" width="3" height="7" fill="#84cc16" />
    <text x="75" y="48" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="end">13 A</text>

    <line x1="4" y1="53" x2="108" y2="53" stroke="#cbd5e1" stroke-width="0.6" />
    <text x="56" y="61" font-size="7.5" font-weight="bold" fill="#475569" text-anchor="middle">Output Frequency</text>
    <text x="56" y="70" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">49.8 Hz</text>
  </g>

  <!-- 5. System Status Box (Center Bottom) -->
  <g transform="translate(510, 270)">
    <rect x="0" y="0" width="112" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    
    <text x="56" y="12" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">System Time</text>
    <text x="56" y="22" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">13.08.2026</text>
    <text x="56" y="31" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">13:44</text>
    
    <line x1="4" y1="35" x2="108" y2="35" stroke="#cbd5e1" stroke-width="0.6" />

    <text x="56" y="43" font-size="7.5" font-weight="bold" fill="#475569" text-anchor="middle">UPS Operation Mode</text>
    <text x="56" y="52" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Normal Operation</text>

    <line x1="4" y1="56" x2="108" y2="56" stroke="#cbd5e1" stroke-width="0.6" />

    <text x="56" y="63" font-size="7.5" font-weight="bold" fill="#475569" text-anchor="middle">System Operation Mode</text>
    <text x="56" y="71" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Inverter</text>
  </g>

  <!-- 6. Output Power Per Phase Box -->
  <g transform="translate(627, 270)">
    <rect x="0" y="0" width="120" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="60" y="11" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">Output Power</text>
    <line x1="15" y1="15" x2="105" y2="15" stroke="#94a3b8" stroke-width="0.6" />
    <text x="15" y="14" font-size="6.5" fill="#64748b">0</text>
    <text x="105" y="14" font-size="6.5" fill="#64748b" text-anchor="end">80</text>

    <!-- Phase Power Rows -->
    <text x="8" y="28" font-size="8" font-weight="bold" fill="#334155">L1</text>
    <rect x="22" y="20" width="5" height="11" fill="#84cc16" />
    <text x="65" y="24" font-size="7.5" font-weight="bold" fill="#1e293b">4 kVA</text>
    <text x="65" y="32" font-size="7.5" font-weight="bold" fill="#1e293b">3 kW</text>

    <text x="8" y="48" font-size="8" font-weight="bold" fill="#334155">L2</text>
    <rect x="22" y="40" width="5" height="11" fill="#84cc16" />
    <text x="65" y="44" font-size="7.5" font-weight="bold" fill="#1e293b">4 kVA</text>
    <text x="65" y="52" font-size="7.5" font-weight="bold" fill="#1e293b">3 kW</text>

    <text x="8" y="67" font-size="8" font-weight="bold" fill="#334155">L3</text>
    <rect x="22" y="59" width="3" height="11" fill="#84cc16" />
    <text x="65" y="63" font-size="7.5" font-weight="bold" fill="#1e293b">2 kVA</text>
    <text x="65" y="71" font-size="7.5" font-weight="bold" fill="#1e293b">2 kW</text>
  </g>

  <!-- ================= LEFT SIDE LED PANEL ================= -->
  <g transform="translate(280, 205)">
    <rect x="0" y="0" width="70" height="120" rx="4" fill="#a4a9ae" stroke="#787d82" stroke-width="1" />
    
    <!-- Top Green LED & Wave Line -->
    <circle cx="20" cy="25" r="5" fill="#3cd070" filter="url(#greenGlow)" />
    <path d="M 38 25 Q 43 20 48 25 T 58 25" fill="none" stroke="#2c3033" stroke-width="2" stroke-linecap="round" />

    <!-- Warning Icon & LED -->
    <rect x="16" y="51" width="8" height="8" fill="#525659" />
    <path d="M 48 48 L 56 61 L 40 61 Z" fill="none" stroke="#2c3033" stroke-width="2" stroke-linejoin="round" />
    <text x="48" y="59" font-size="9" font-weight="bold" fill="#2c3033" text-anchor="middle">!</text>

    <!-- Fault Icon & LED -->
    <rect x="16" y="81" width="8" height="8" fill="#525659" />
    <polygon points="48,77 56,83 56,91 48,97 40,91 40,83" fill="none" stroke="#2c3033" stroke-width="1.8" />
    <path d="M 44 83 L 52 91 M 52 83 L 44 91" stroke="#2c3033" stroke-width="1.8" />
  </g>

  <!-- ================= RIGHT SIDE BLANK PANEL ================= -->
  <g transform="translate(790, 205)">
    <rect x="0" y="0" width="70" height="120" rx="4" fill="#a4a9ae" stroke="#787d82" stroke-width="1" />
  </g>

  <!-- ================= BOTTOM MIMIC DIAGRAM & BUTTONS ================= -->
  <g transform="translate(280, 435)">
    <!-- Diagram Panel Area -->
    <rect x="0" y="0" width="580" height="95" rx="5" fill="#9ea3a8" stroke="#6b7075" stroke-width="1.5" />

    <!-- Mimic Diagram Lines -->
    <!-- INPUT Line -->
    <text x="15" y="22" font-size="11" font-weight="bold" fill="#1e242b">INPUT</text>
    <polygon points="62,15 72,19 62,23" fill="#1e242b" />
    <line x1="72" y1="19" x2="310" y2="19" stroke="#1e242b" stroke-width="2" />
    
    <!-- Input Status Green LEDs -->
    <circle cx="108" cy="19" r="6" fill="#3cd070" filter="url(#greenGlow)" />
    <circle cx="202" cy="19" r="6" fill="#3cd070" filter="url(#greenGlow)" />
    <circle cx="275" cy="19" r="6" fill="#3cd070" filter="url(#greenGlow)" />

    <!-- Battery Branch -->
    <line x1="160" y1="19" x2="160" y2="35" stroke="#1e242b" stroke-width="2" />
    <!-- Battery Icon -->
    <g transform="translate(148, 35)">
      <rect x="0" y="0" width="24" height="16" rx="1" fill="none" stroke="#1e242b" stroke-width="2" />
      <rect x="8" y="-3" width="8" height="3" fill="#1e242b" />
      <text x="4" y="12" font-size="10" font-weight="bold" fill="#1e242b">-</text>
      <text x="14" y="12" font-size="9" font-weight="bold" fill="#1e242b">+</text>
    </g>
    <line x1="160" y1="51" x2="160" y2="60" stroke="#1e242b" stroke-width="2" />
    <line x1="160" y1="60" x2="225" y2="60" stroke="#1e242b" stroke-width="2" />
    <line x1="225" y1="60" x2="225" y2="19" stroke="#1e242b" stroke-width="2" />
    <circle cx="160" cy="30" r="2.5" fill="#1e242b" />
    <circle cx="225" cy="30" r="2.5" fill="#1e242b" />

    <!-- BYPASS Line -->
    <text x="15" y="78" font-size="11" font-weight="bold" fill="#1e242b">BYPASS</text>
    <polygon points="68,71 78,75 68,79" fill="#1e242b" />
    <line x1="78" y1="75" x2="225" y2="75" stroke="#1e242b" stroke-width="2" />
    <circle cx="160" cy="75" r="6" fill="#3cd070" filter="url(#greenGlow)" />
    
    <!-- Output Line -->
    <polygon points="310,15 322,19 310,23" fill="#1e242b" />
    <text x="330" y="22" font-size="11" font-weight="bold" fill="#1e242b">OUTPUT</text>

    <!-- Physical Control Buttons (Right Side of Mimic Panel) -->
    <!-- Green Start/ON Button -->
    <g transform="translate(465, 20)">
      <rect x="0" y="0" width="38" height="52" rx="6" fill="#00a651" stroke="#007a3b" stroke-width="2" />
      <rect x="4" y="4" width="30" height="44" rx="4" fill="none" stroke="#5cdb94" stroke-width="1.5" />
      <!-- 'I' Symbol -->
      <line x1="19" y1="16" x2="19" y2="36" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- White Stop/OFF Button -->
    <g transform="translate(518, 20)">
      <rect x="0" y="0" width="38" height="52" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
      <rect x="4" y="4" width="30" height="44" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <!-- 'O' Symbol -->
      <circle cx="19" cy="26" r="9" fill="none" stroke="#1e293b" stroke-width="3.5" />
    </g>
  </g>
</svg>
