upstream chirpstack {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream chirpstack_rest_api {
    server 127.0.0.1:8090;
    keepalive 16;
}



server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.php index.html;
    client_max_body_size 50M;

    access_log /var/log/nginx/jconnect.access.log;
    error_log  /var/log/nginx/jconnect.error.log;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

#   location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav)$ {
#        try_files $uri =404;
#        access_log off;
#        expires max;
#        log_not_found off;
#    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
    location /api2/ {
        rewrite ^/api2/(.*)$ /$1 break;
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /backend/ {
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /alarmapi/ {
	proxy_pass http://localhost:3004/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
    }
    # pgAdmin4 Web Interface
    location /database/ {
        proxy_pass http://127.0.0.1:8080/pgadmin4/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Script-Name /database;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /filemanager/ {
        alias /var/www/filemanager/;

        index index.php;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
            expires max;
            log_not_found off;
        }

        try_files $uri $uri/ =404;
    }

    # ChirpStack API (existing)
    location /loraapi/chirpstack/ {
        rewrite ^/loraapi/chirpstack/(.*) /api/$1 break;
        proxy_pass http://chirpstack;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ChirpStack REST API (existing)
    location /loraapi/rest/ {
        rewrite ^/loraapi/rest/(.*) /$1 break;
        proxy_pass http://chirpstack_rest_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
