services:

  timescaledb:
    image: timescale/timescaledb:2.13.1-pg14
    container_name: timescaledb
    environment:
      POSTGRES_DB: jconnect
      POSTGRES_USER: jconnect
      POSTGRES_PASSWORD: P@ssword-001
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jconnect -d jconnect"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  php:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jconnect-php:8.3
    container_name: jconnectgt7000-php
    environment:
      DB_HOST: timescaledb
      CI_ENV: development
      TZ: Asia/Bangkok
    volumes:
      - ./frontend:/var/www/frontend
      - ./frontend/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: jconnect-public-api:1
    container_name: jconnectgt7000-api
    environment:
      DB_HOST: timescaledb
      DB_USER: jconnect
      DB_PASSWORD: P@ssword-001
      DB_NAME: jconnect
      TZ: Asia/Bangkok
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: jconnectgt7000-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/var/www/frontend:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/api-status-limit.conf:/etc/nginx/conf.d/00-api-status-limit.conf:ro
    depends_on:
      - php
      - api
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: support@ihx.co.th
      PGADMIN_DEFAULT_PASSWORD: P@ssword-001
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  timescale_data:
  pgadmin_data:
